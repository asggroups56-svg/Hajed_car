<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>بن وزير للسيارات</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #172033;
      --card-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #d4a437;
      --primary-2: #f0c65c;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(212, 164, 55, 0.22), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.18), transparent 40%),
        var(--bg);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 460px;
      padding: 28px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--card-2), var(--card));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 38px;
      background: linear-gradient(145deg, var(--primary-2), var(--primary));
      box-shadow: 0 12px 30px rgba(212, 164, 55, 0.3);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.4;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .car-id {
      display: inline-block;
      margin: 16px 0 4px;
      padding: 7px 14px;
      border: 1px dashed rgba(212, 164, 55, 0.45);
      border-radius: 999px;
      color: var(--primary-2);
      font-size: 13px;
      direction: ltr;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 18px;
      border: 0;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(145deg, var(--primary-2), var(--primary));
      color: #211a05;
    }

    .btn-secondary {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 18px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🚗</div>
    <h1>بن وزير للسيارات</h1>
    <p id="message">جاري تجهيز رابط السيارة...</p>
    <div id="carIdBox" class="car-id hidden"></div>

    <div id="actions" class="actions hidden">
      <a id="openAppBtn" class="btn btn-primary hidden" href="#">فتح التطبيق</a>
      <a id="androidBtn" class="btn btn-primary" href="#">تحميل التطبيق من Google Play</a>
      <a id="iosBtn" class="btn btn-primary" href="#">تحميل التطبيق من App Store</a>
      <a class="btn btn-secondary" href="/">تصفح الموقع</a>
    </div>

    <div class="hint" id="hint">
      إن كان التطبيق مثبتاً على جهازك فسيُفتح تلقائياً لعرض تفاصيل السيارة.
    </div>
  </main>

  <script>
    // ---------------------------------------------------------------------
    // Configure these three values before deploying this page.
    // ---------------------------------------------------------------------
    const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.Hajed.car';
    const APP_STORE_URL = 'https://apps.apple.com/app/id000000000'; // Replace with your App Store id.
    const CUSTOM_SCHEME = 'hajedcar';
    const CAR_PATH = 'car';

    const messageEl = document.getElementById('message');
    const carIdBox = document.getElementById('carIdBox');
    const actions = document.getElementById('actions');
    const openAppBtn = document.getElementById('openAppBtn');
    const androidBtn = document.getElementById('androidBtn');
    const iosBtn = document.getElementById('iosBtn');
    const hint = document.getElementById('hint');

    function getCarId() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const carIndex = parts.indexOf(CAR_PATH);
      if (carIndex !== -1 && parts[carIndex + 1]) {
        return decodeURIComponent(parts[carIndex + 1]).trim();
      }
      const params = new URLSearchParams(window.location.search);
      return (params.get('car_id') || params.get('carId') || params.get('id') || '').trim();
    }

    function isAndroid() {
      return /android/i.test(navigator.userAgent || '');
    }

    function isIOS() {
      const ua = navigator.userAgent || '';
      const iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      return /iPhone|iPad|iPod/i.test(ua) || iPadOS;
    }

    const carId = getCarId();

    if (!carId) {
      messageEl.textContent = 'رابط السيارة غير صالح. تأكد من فتح الرابط كاملاً.';
      hint.textContent = 'يمكنك تصفح الموقع للوصول إلى السيارات المتاحة.';
      actions.classList.remove('hidden');
      androidBtn.classList.remove('hidden');
      iosBtn.classList.remove('hidden');
    } else {
      carIdBox.textContent = 'CAR ID: ' + carId;
      carIdBox.classList.remove('hidden');

      const encodedId = encodeURIComponent(carId);
      const customLink = `${CUSTOM_SCHEME}://car/${encodedId}`;
      const playLink = `${PLAY_STORE_URL}&referrer=${encodeURIComponent('car_id=' + encodedId)}`;

      openAppBtn.href = customLink;
      androidBtn.href = playLink;
      iosBtn.href = APP_STORE_URL;

      if (isAndroid()) {
        messageEl.textContent = 'جاري تحويلك إلى Google Play لتثبيت التطبيق...';
        window.setTimeout(() => window.location.replace(playLink), 350);
      } else if (isIOS()) {
        messageEl.textContent = 'جاري تحويلك إلى App Store لتثبيت التطبيق...';
        window.setTimeout(() => window.location.replace(APP_STORE_URL), 350);
      } else {
        messageEl.textContent = 'افتح التطبيق لعرض تفاصيل هذه السيارة، أو حمّله على جهازك.';
        actions.classList.remove('hidden');
        androidBtn.classList.remove('hidden');
        iosBtn.classList.remove('hidden');
        openAppBtn.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
